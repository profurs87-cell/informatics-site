<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход для учеников</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
    <div class="login-card">
        <h1 class="login-title">Вход в систему</h1>
        <p class="login-subtitle">Введите логин класса и пароль, выданный учителем</p>
        
        <div id="errorMessage" class="error-message"></div>
        
        <div class="input-group">
            <label class="input-label" for="loginInput">Логин класса</label>
            <input type="text" id="loginInput" class="input-field" placeholder="Например: 7a" autocomplete="off" spellcheck="false">
        </div>
        
        <div class="input-group">
            <label class="input-label" for="passwordInput">Пароль</label>
            <div class="password-wrapper">
                <input type="password" id="passwordInput" class="input-field" placeholder="Введите пароль" autocomplete="off">
                <button type="button" class="toggle-password" id="togglePassword" title="Показать пароль">👁️</button>
            </div>
        </div>
        
        <button id="loginBtn" class="login-btn" disabled>Войти</button>
        
        <div class="login-footer">
            <a href="index.html">← На главную страницу</a>
        </div
    </div>
    
    <script src="js/auth.js"></script>
    <script>
        let classesData = null;
        const loginInput = document.getElementById('loginInput');
        const passwordInput = document.getElementById('passwordInput');
        const loginBtn = document.getElementById('loginBtn');
        const errorMessage = document.getElementById('errorMessage');

        async function init() {
            classesData = await loadClasses();
            if (!classesData) {
                showError('Ошибка загрузки данных. Проверьте интернет.');
                return;
            }
        }

        function updateButtonState() {
            loginBtn.disabled = !(loginInput.value.trim() && passwordInput.value.trim());
        }

        loginInput.addEventListener('input', () => {
            updateButtonState();
            hideError();
        });
        
        passwordInput.addEventListener('input', () => {
            updateButtonState();
            hideError();
        });

        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !loginBtn.disabled) attemptLogin();
        });

        loginBtn.addEventListener('click', attemptLogin);

        function attemptLogin() {
            if (!classesData) return;
            
            const result = verifyCredentials(classesData, loginInput.value, passwordInput.value);
            
            if (result.success) {
                saveSession(result.classId, result.className);
                window.location.href = 'materials.html';
            } else {
                showError(result.message);
                passwordInput.value = '';
                passwordInput.focus();
            }
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
        }

        function hideError() {
            errorMessage.classList.remove('show');
        }

        // Показать/скрыть пароль
        document.getElementById('togglePassword').addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            document.getElementById('togglePassword').textContent = type === 'password' ? '👁️' : '🙈';
        });

        init();
    </script>
</body>
</html>
