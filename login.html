<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход для учеников</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
    <div class="login-card">
        <h1 class="login-title">Вход для учеников</h1>
        <p class="login-subtitle">Выберите класс и введите код доступа</p>
        
        <div id="errorMessage" class="error-message"></div>
        
        <div class="class-selector">
            <label class="class-selector-label">Ваш класс:</label>
            <div class="class-buttons" id="classButtons">
                <!-- Кнопки классов добавятся через JavaScript -->
            </div>
        </div>
        
        <div class="code-input-group">
            <label class="code-input-label" for="codeInput">Код доступа:</label>
            <input 
                type="text" 
                id="codeInput" 
                class="code-input" 
                placeholder="Например: INFO7A-2026"
                autocomplete="off"
                spellcheck="false"
            >
        </div>
        
        <button id="loginBtn" class="login-btn" disabled>Войти</button>
        
        <div class="login-footer">
            <a href="index.html">← На главную страницу</a>
        </div>
    </div>
    
    <script src="js/auth.js"></script>
    <script>
        let selectedClass = null;
        let classesData = null;
        
        // Инициализация страницы
        async function init() {
            // Загружаем список классов
            classesData = await loadClasses();
            if (!classesData) {
                showError('Не удалось загрузить данные. Проверьте подключение к интернету.');
                return;
            }
            
            // Создаём кнопки классов
            renderClassButtons();
            
            // Проверяем, указан ли класс в URL
            const urlClass = getClassFromURL();
            if (urlClass && classesData[urlClass]) {
                selectClass(urlClass);
                // Фокус на поле ввода
                document.getElementById('codeInput').focus();
            }
        }
        
        // Отрисовка кнопок классов
        function renderClassButtons() {
            const container = document.getElementById('classButtons');
            container.innerHTML = '';
            
            Object.keys(classesData).forEach(classId => {
                const btn = document.createElement('button');
                btn.className = 'class-btn';
                btn.textContent = classesData[classId].name;
                btn.dataset.classId = classId;
                btn.addEventListener('click', () => selectClass(classId));
                container.appendChild(btn);
            });
        }
        
        // Выбор класса
        function selectClass(classId) {
            selectedClass = classId;
            
            // Обновляем активную кнопку
            document.querySelectorAll('.class-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.classId === classId);
            });
            
            // Активируем кнопку входа
            updateLoginButton();
            
            // Скрываем ошибку
            hideError();
        }
        
        // Обновление состояния кнопки входа
        function updateLoginButton() {
            const codeInput = document.getElementById('codeInput');
            const loginBtn = document.getElementById('loginBtn');
            loginBtn.disabled = !(selectedClass && codeInput.value.trim());
        }
        
        // Обработка ввода кода
        document.getElementById('codeInput').addEventListener('input', updateLoginButton);
        
        // Обработка нажатия Enter
        document.getElementById('codeInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !document.getElementById('loginBtn').disabled) {
                attemptLogin();
            }
        });
        
        // Обработка кнопки входа
        document.getElementById('loginBtn').addEventListener('click', attemptLogin);
        
        // Попытка входа
        function attemptLogin() {
            const codeInput = document.getElementById('codeInput');
            const code = codeInput.value;
            
            if (!selectedClass) {
                showError('Пожалуйста, выберите класс');
                return;
            }
            
            if (!code.trim()) {
                showError('Пожалуйста, введите код доступа');
                return;
            }
            
            const result = verifyCode(classesData, selectedClass, code);
            
            if (result.success) {
                // Сохраняем сессию и переходим к материалам
                saveSession(selectedClass, result.className);
                window.location.href = 'materials.html';
            } else {
                showError(result.message);
                codeInput.value = '';
                codeInput.focus();
            }
        }
        
        // Показать ошибку
        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = message;
            errorEl.classList.add('show');
        }
        
        // Скрыть ошибку
        function hideError() {
            const errorEl = document.getElementById('errorMessage');
            errorEl.classList.remove('show');
        }
        
        // Запуск
        init();
    </script>
</body>
</html>
